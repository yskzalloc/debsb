[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "debsb"
version = "0.2.1"
description = "Debian Sid Sandbox — instant QEMU/KVM VM from cloud images"
readme = "README.md"
license = {text = "GPL-2.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "Yunseong Kim", email = "yunseong.kim@est.tech"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
]

[project.scripts]
debsb = "debsb.cli:entry_point"

[project.urls]
Homepage = "https://github.com/yskzalloc/debsb"
Repository = "https://github.com/yskzalloc/debsb"
Issues = "https://github.com/yskzalloc/debsb/issues"

[tool.setuptools.packages.find]
where = ["src"]
