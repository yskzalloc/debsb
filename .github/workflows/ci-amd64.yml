name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 23 * * *'

jobs:
  debian-sid-clound-image-vanilla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First thing after checkout: everything below (toolchains, clones,
      # sanitizer kernel build, xfstests exports) shares this filesystem,
      # and a KASAN/KMSAN build with debug info alone can eat 15-25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cloud-image-utils whois wget openssh-client

      - name: Install debsb
        run: pip install -e .

      - name: Build sandbox
        run: debsb build --size 10G --verbose

      - name: Run test
        run: debsb run --ssh --root --exec "cd .debsb/; ls -ahl; uname -a"

  debian-sid-clound-image-with-upstream-kernel-deb-pkg-installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First thing after checkout: everything below (toolchains, clones,
      # sanitizer kernel build, xfstests exports) shares this filesystem,
      # and a KASAN/KMSAN build with debug info alone can eat 15-25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cloud-image-utils whois wget openssh-client \
            build-essential flex bison bc libelf-dev libssl-dev libncurses-dev \
            dwarves pahole libdw-dev libdwarf-dev kmod debhelper

      - name: Install debsb
        run: pip install -e .

      - name: Clone upstream kernel
        run: git clone --depth 1 https://github.com/torvalds/linux.git

      - name: Build sandbox with upstream kernel
        run: |
          debsb build ./linux --size 10G --verbose \
              `# --- boot without an initrd (built-in for both qemu and crosvm) ---` \
              --configitem CONFIG_VIRTIO=y \
              --configitem CONFIG_VIRTIO_PCI=y \
              --configitem CONFIG_VIRTIO_BLK=y \
              --configitem CONFIG_VIRTIO_NET=y \
              --configitem CONFIG_VIRTIO_CONSOLE=y \
              --configitem CONFIG_EXT4_FS=y \
              --configitem CONFIG_IP_PNP=y \
              --configitem CONFIG_IP_PNP_DHCP=y \
              `# --- coverage for syzkaller ---` \
              --configitem CONFIG_KCOV=y \
              --configitem CONFIG_KCOV_INSTRUMENT_ALL=y \
              --configitem CONFIG_KCOV_ENABLE_COMPARISONS=y \
              --configitem CONFIG_DEBUG_FS=y \
              --configitem CONFIG_DEBUG_KERNEL=y \
              `# --- KASAN memory bug detection ---` \
              --configitem CONFIG_KASAN=y \
              --configitem CONFIG_KASAN_INLINE=y \
              `# --- symbolization ---` \
              --configitem CONFIG_KALLSYMS=y \
              --configitem CONFIG_KALLSYMS_ALL=y \
              `# --- fault injection ---` \
              --configitem CONFIG_FAULT_INJECTION=y \
              --configitem CONFIG_FAULT_INJECTION_DEBUG_FS=y \
              --configitem CONFIG_FAILSLAB=y \
              --configitem CONFIG_FAIL_MAKE_REQUEST=y \
              --configitem CONFIG_FAIL_IO_TIMEOUT=y \
              --configitem CONFIG_FAIL_FUTEX=y \
              `# --- namespaces for syzkaller sandbox ---` \
              --configitem CONFIG_USER_NS=y \
              --configitem CONFIG_NET_NS=y

      - name: Verify kernel
        run: debsb run --ssh --root --exec "cd .debsb/; ls -ahl; uname -a; grep CONFIG_KCOV /boot/config-\$(uname -r)"

  debian-sid-clound-image-with-upstream-kernel-deb-pkg-clang-build-installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First thing after checkout: everything below (toolchains, clones,
      # sanitizer kernel build, xfstests exports) shares this filesystem,
      # and a KASAN/KMSAN build with debug info alone can eat 15-25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cloud-image-utils whois wget openssh-client \
            build-essential flex bison bc libelf-dev libssl-dev libncurses-dev \
            dwarves pahole libdw-dev libdwarf-dev kmod debhelper \
            clang llvm lld

      - name: Install debsb
        run: pip install -e .

      - name: Clone upstream kernel
        run: git clone --depth 1 https://github.com/torvalds/linux.git

      # LLVM=1 selects clang plus ld.lld/llvm-ar/llvm-nm.  It must reach make as
      # a command-line assignment -- debsb forwards LLVM/CC/HOSTCC from the
      # environment for exactly this reason.  A bare `export CC=clang` does not
      # work: Kbuild assigns CC in the Makefile, which outranks the environment.
      - name: Build sandbox with upstream kernel
        run: |
          export LLVM=1
          debsb build ./linux --size 10G --verbose \
              `# --- boot without an initrd (built-in for both qemu and crosvm) ---` \
              --configitem CONFIG_VIRTIO=y \
              --configitem CONFIG_VIRTIO_PCI=y \
              --configitem CONFIG_VIRTIO_BLK=y \
              --configitem CONFIG_VIRTIO_NET=y \
              --configitem CONFIG_VIRTIO_CONSOLE=y \
              --configitem CONFIG_EXT4_FS=y \
              --configitem CONFIG_IP_PNP=y \
              --configitem CONFIG_IP_PNP_DHCP=y \
              `# --- coverage for syzkaller ---` \
              --configitem CONFIG_KCOV=y \
              --configitem CONFIG_KCOV_INSTRUMENT_ALL=y \
              --configitem CONFIG_KCOV_ENABLE_COMPARISONS=y \
              --configitem CONFIG_DEBUG_FS=y \
              --configitem CONFIG_DEBUG_KERNEL=y \
              `# --- KASAN memory bug detection ---` \
              --configitem CONFIG_KASAN=y \
              --configitem CONFIG_KASAN_INLINE=y \
              `# --- symbolization ---` \
              --configitem CONFIG_KALLSYMS=y \
              --configitem CONFIG_KALLSYMS_ALL=y \
              `# --- fault injection ---` \
              --configitem CONFIG_FAULT_INJECTION=y \
              --configitem CONFIG_FAULT_INJECTION_DEBUG_FS=y \
              --configitem CONFIG_FAILSLAB=y \
              --configitem CONFIG_FAIL_MAKE_REQUEST=y \
              --configitem CONFIG_FAIL_IO_TIMEOUT=y \
              --configitem CONFIG_FAIL_FUTEX=y \
              `# --- namespaces for syzkaller sandbox ---` \
              --configitem CONFIG_USER_NS=y \
              --configitem CONFIG_NET_NS=y

      - name: Verify kernel
        run: debsb run --ssh --root --exec "cd .debsb/; ls -ahl; uname -a; grep -E 'CONFIG_KCOV=|CONFIG_CC_IS_CLANG=' /boot/config-\$(uname -r)"

  debian-sid-clound-image-upstream-debian-installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First thing after checkout: everything below (toolchains, clones,
      # sanitizer kernel build, xfstests exports) shares this filesystem,
      # and a KASAN/KMSAN build with debug info alone can eat 15-25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cloud-image-utils whois wget openssh-client \
            build-essential flex bison bc libelf-dev libssl-dev libncurses-dev \
            dwarves pahole libdw-dev libdwarf-dev kmod gcc-15 \
            python3-dacite python3-debian python3-jinja2 debhelper quilt rsync devscripts dh-python

      - name: Install debsb
        run: pip install -e .

      - name: Build sandbox with Debian kernel
        run: |
          debsb build --debian --size 10G --verbose \
              `# --- boot without an initrd (built-in for both qemu and crosvm) ---` \
              --configitem CONFIG_VIRTIO=y \
              --configitem CONFIG_VIRTIO_PCI=y \
              --configitem CONFIG_VIRTIO_BLK=y \
              --configitem CONFIG_VIRTIO_NET=y \
              --configitem CONFIG_VIRTIO_CONSOLE=y \
              --configitem CONFIG_EXT4_FS=y \
              --configitem CONFIG_IP_PNP=y \
              --configitem CONFIG_IP_PNP_DHCP=y \
              `# --- coverage for syzkaller ---` \
              --configitem CONFIG_KCOV=y \
              --configitem CONFIG_KCOV_INSTRUMENT_ALL=y \
              --configitem CONFIG_KCOV_ENABLE_COMPARISONS=y \
              --configitem CONFIG_DEBUG_FS=y \
              --configitem CONFIG_DEBUG_KERNEL=y \
              `# --- KASAN memory bug detection ---` \
              --configitem CONFIG_KASAN=y \
              --configitem CONFIG_KASAN_INLINE=y \
              `# --- symbolization ---` \
              --configitem CONFIG_KALLSYMS=y \
              --configitem CONFIG_KALLSYMS_ALL=y \
              `# --- fault injection ---` \
              --configitem CONFIG_FAULT_INJECTION=y \
              --configitem CONFIG_FAULT_INJECTION_DEBUG_FS=y \
              --configitem CONFIG_FAILSLAB=y \
              --configitem CONFIG_FAIL_MAKE_REQUEST=y \
              --configitem CONFIG_FAIL_IO_TIMEOUT=y \
              --configitem CONFIG_FAIL_FUTEX=y \
              `# --- namespaces for syzkaller sandbox ---` \
              --configitem CONFIG_USER_NS=y \
              --configitem CONFIG_NET_NS=y

      - name: Verify kernel
        run: debsb run --ssh --root --exec "cd .debsb/; ls -ahl; uname -a; grep CONFIG_KCOV /boot/config-\$(uname -r)"
