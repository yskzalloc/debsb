name: CI (arm64)

# arm64 GitHub runners do not expose /dev/kvm, and a same-architecture TCG
# guest picks QEMU's multi-threaded TCG by default -- which wedges these guests
# part-way through cloud-init and no boot budget can rescue that.  So instead of
# a native arm64 runner, this workflow runs on the ordinary x86_64 runners and
# cross-emulates arm64: `debsb build --arch arm64` / `debsb run --arch arm64`.
#
# Cross-arch always means TCG (KVM cannot execute a foreign instruction set),
# and QEMU uses single-threaded TCG for a foreign guest, which is the mode
# these guests survive.  It is slow -- a KASAN kernel under emulation can take
# well over an hour to reach cloud-init's network stage -- so the jobs live in
# their own workflow and DEBSB_SSH_TIMEOUT below pins a generous budget.
#
# Serial console: the arm64 guest console is the virt machine's PL011 UART
# (ttyAMA0).  A guest kernel therefore needs CONFIG_SERIAL_AMBA_PL011=y and
# _CONSOLE=y or ~/.debsb/serial.log stays empty; debsb pins both on for arm64
# builds so the "Guest console on failure" step below has something to show.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: ci-arm64-${{ github.ref }}
  cancel-in-progress: true

# Per boot ATTEMPT, not per job: debsb boots the guest again if the first one
# never answers, so the worst case is twice this.  Cross-emulation is slower
# than the native-arch TCG this workflow used before, so keep the budget high.
env:
  DEBSB_SSH_TIMEOUT: '7200'

jobs:
  debian-sid-clound-image-vanilla-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First thing after checkout: everything below (toolchains, clones,
      # sanitizer kernel build, xfstests exports) shares this filesystem,
      # and a KASAN/KMSAN build with debug info alone can eat 15-25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # Cross-emulation always uses TCG; KVM on this x86_64 host cannot run an
      # arm64 guest.  debsb forces TCG on its own when --arch differs from the
      # host, so nothing here needs /dev/kvm.
      - name: Report KVM availability
        run: |
          ls -l /dev/kvm || echo "no arm64 KVM possible on x86_64: debsb uses TCG for --arch arm64"

      # qemu-system-arm provides qemu-system-aarch64; qemu-efi-aarch64 provides
      # AAVMF, since arm64 guests boot via UEFI even under emulation.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 \
            cloud-image-utils whois wget openssh-client

      - name: Install debsb
        run: pip install -e .

      - name: Build sandbox (arm64 cross)
        run: debsb build --arch arm64 --size 10G --reset --verbose

      - name: Run test (arm64 cross)
        run: debsb run --arch arm64 --ssh --root --exec "cd .debsb/; ls -ahl; uname -a"

      # A guest that never reaches sshd is otherwise invisible: debsb prints
      # the tail itself, this shows the whole console for the boot that failed.
      - name: Guest console on failure
        if: failure()
        run: tail -n 400 ~/.debsb/serial.log || echo "no serial log captured"

  debian-sid-clound-image-with-upstream-kernel-deb-pkg-installed-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First thing after checkout: everything below (toolchains, clones,
      # sanitizer kernel build, xfstests exports) shares this filesystem,
      # and a KASAN/KMSAN build with debug info alone can eat 15-25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Report KVM availability
        run: |
          ls -l /dev/kvm || echo "no arm64 KVM possible on x86_64: debsb uses TCG for --arch arm64"

      # gcc-aarch64-linux-gnu is the cross toolchain debsb forwards to Kbuild as
      # CROSS_COMPILE=aarch64-linux-gnu- when the target arch differs from the
      # host; without it the cross build fails at the first compile.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 \
            cloud-image-utils whois wget openssh-client \
            build-essential flex bison bc libelf-dev libssl-dev libncurses-dev \
            dwarves pahole libdw-dev libdwarf-dev kmod debhelper \
            gcc-aarch64-linux-gnu

      - name: Install debsb
        run: pip install -e .

      - name: Clone upstream kernel
        run: git clone --depth 1 https://github.com/torvalds/linux.git

      - name: Build sandbox with upstream kernel (arm64 cross)
        run: debsb build --arch arm64 ./linux --configitem CONFIG_KASAN=y --configitem CONFIG_KCOV=y --size 20G --reset --verbose

      - name: Verify kernel
        run: debsb run --arch arm64 --ssh --root --exec "cd .debsb/; ls -ahl; uname -a; grep CONFIG_KCOV /usr/lib/modules/\$(uname -r)/config 2>/dev/null || grep CONFIG_KCOV /boot/config-\$(uname -r)"

      - name: Guest console on failure
        if: failure()
        run: tail -n 400 ~/.debsb/serial.log || echo "no serial log captured"

  debian-sid-clound-image-with-upstream-kernel-deb-pkg-clang-build-installed-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First thing after checkout: everything below (toolchains, clones,
      # sanitizer kernel build, xfstests exports) shares this filesystem,
      # and a KASAN/KMSAN build with debug info alone can eat 15-25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Report KVM availability
        run: |
          ls -l /dev/kvm || echo "no arm64 KVM possible on x86_64: debsb uses TCG for --arch arm64"

      # clang/lld is a native cross compiler: LLVM=1 with ARCH=arm64 targets
      # aarch64 without a gcc triplet, so no gcc-aarch64-linux-gnu is needed
      # here.  debsb still forwards CROSS_COMPILE, which clang harmlessly
      # ignores for the target selection.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 \
            cloud-image-utils whois wget openssh-client \
            build-essential flex bison bc libelf-dev libssl-dev libncurses-dev \
            dwarves pahole libdw-dev libdwarf-dev kmod debhelper \
            clang llvm lld

      - name: Install debsb
        run: pip install -e .

      - name: Clone upstream kernel
        run: git clone --depth 1 https://github.com/torvalds/linux.git

      # LLVM=1 selects clang plus ld.lld/llvm-ar/llvm-nm.  It must reach make as
      # a command-line assignment -- debsb forwards LLVM/CC/HOSTCC from the
      # environment for exactly this reason.  A bare `export CC=clang` does not
      # work: Kbuild assigns CC in the Makefile, which outranks the environment.
      # clang cross-compiles arm64 from x86_64 with only ARCH=arm64, which debsb
      # adds automatically for a foreign --arch.
      - name: Build sandbox with upstream kernel (arm64 cross)
        run: |
          export LLVM=1
          debsb build --arch arm64 ./linux --configitem CONFIG_KASAN=y --configitem CONFIG_KCOV=y --size 20G --reset --verbose

      - name: Verify kernel
        run: debsb run --arch arm64 --ssh --root --exec "cd .debsb/; ls -ahl; uname -a; grep -E 'CONFIG_KCOV=|CONFIG_CC_IS_CLANG=' /usr/lib/modules/\$(uname -r)/config 2>/dev/null || grep -E 'CONFIG_KCOV=|CONFIG_CC_IS_CLANG=' /boot/config-\$(uname -r)"

      - name: Guest console on failure
        if: failure()
        run: tail -n 400 ~/.debsb/serial.log || echo "no serial log captured"

  debian-sid-clound-image-upstream-debian-installed-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First thing after checkout: everything below (toolchains, clones,
      # sanitizer kernel build, xfstests exports) shares this filesystem,
      # and a KASAN/KMSAN build with debug info alone can eat 15-25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Report KVM availability
        run: |
          ls -l /dev/kvm || echo "no arm64 KVM possible on x86_64: debsb uses TCG for --arch arm64"

      # Cross-building the Debian arm64 kernel on x86_64 needs the aarch64 gcc
      # (CROSS_COMPILE=aarch64-linux-gnu-) plus the armhf gcc for the 32-bit
      # compat vDSO (CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-); debsb sets both
      # when --arch arm64 differs from the host.  Without them the build fails
      # at the first compile / at arch/arm64/kernel/vdso32/note.o respectively.
      - name: Install dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 \
            cloud-image-utils whois wget openssh-client \
            build-essential flex bison bc libelf-dev libssl-dev libncurses-dev \
            dwarves pahole libdw-dev libdwarf-dev kmod gcc-15 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            python3-dacite python3-debian python3-jinja2 debhelper quilt rsync devscripts dh-python

      - name: Install debsb
        run: pip install -e .

      - name: Build sandbox with Debian kernel (arm64 cross)
        run: debsb build --arch arm64 --debian --configitem CONFIG_KASAN=y --configitem CONFIG_KCOV=y --size 20G --reset --verbose

      - name: Verify kernel
        run: debsb run --arch arm64 --ssh --root --exec "cd .debsb/; ls -ahl; uname -a; grep CONFIG_KCOV /usr/lib/modules/\$(uname -r)/config 2>/dev/null || grep CONFIG_KCOV /boot/config-\$(uname -r)"

      - name: Guest console on failure
        if: failure()
        run: tail -n 400 ~/.debsb/serial.log || echo "no serial log captured"
